[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "urirun-work"
version = "0.2.0"
description = "Parallel work scheduler for koru: independent lanes + declared locks + worker pool. koru stays the executor; this decides what runs in parallel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tom Sapletta" }]
dependencies = []
[project.scripts]
urirun-work = "urirun_work.cli:main"
[tool.setuptools.packages.find]
include = ["urirun_work*"]

[tool.wellmanifest]
standard = "0.20.35"
revision = "cfaa0bf0ea6b0e7349fed0bb62b5ce15792d687d"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
